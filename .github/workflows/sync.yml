# Синхронизация с главным дилерским сайтом (almaliceramicc/almaly-dealers, только чтение):
# каталог, остатки, фото. Каждые 30 минут и по кнопке «Run workflow».
# Коммит делается только если что-то изменилось (иначе — ни коммита, ни пересборки сайта).
name: Синхронизация с главным сайтом
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-master
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Зависимости (OCR нужен только для новых фото)
        run: pip install -r tools/requirements.txt
      - name: Синхронизация
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sync.py
      - name: Коммит, если есть изменения
        run: |
          git add -A data.js photos-manifest.json tools/sync-state.json img img2
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          git config user.name "almaly-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Синхронизация с главным сайтом: $(git diff --cached --name-only | grep -c . ) файлов"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            echo "Повтор через 10 с"; sleep 10
          done
          exit 1
